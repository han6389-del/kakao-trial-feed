<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FEE500">
<meta name="description" content="카카오 선물하기 체험단 모집 목록을 당첨확률·마감일과 함께 보는 모바일 피드">
<title>카카오 체험단 피드</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="체험단">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header>
  <div class="hd-row">
    <div>
      <h1>🎁 카카오 체험단</h1>
      <p class="sub">선물하기 체험단 · 내 기준으로 이미 걸러둔 목록</p>
    </div>
    <button id="refresh" type="button" aria-label="새로고침" title="새로고침">⟳</button>
  </div>
  <div class="stats">
    <div class="stat"><span class="v" id="stScope">–</span><span class="k" id="stScopeLabel">미신청</span></div>
    <div class="stat"><span class="v" id="stNew">–</span><span class="k">신규</span></div>
    <div class="stat"><span class="v" id="stDone">0</span><span class="k">신청 완료</span></div>
    <div class="stat"><span class="v" id="stBest">–</span><span class="k">최고 확률</span></div>
  </div>
  <div class="meta">
    <span id="updatedAt">불러오는 중…</span>
    <span id="staleNote" class="warn" hidden>오래된 데이터</span>
  </div>
  <div class="bar" aria-hidden="true"><i id="progressBar"></i></div>
</header>

<div class="toolbar">
  <div class="search" id="searchWrap">
    <span class="ico" aria-hidden="true">🔍</span>
    <input id="q" type="search" placeholder="상품·브랜드 검색" autocomplete="off" enterkeyhint="search" aria-label="검색">
    <button class="clear" id="qClear" type="button" aria-label="검색어 지우기">✕</button>
  </div>
  <div class="chips status" role="tablist" aria-label="상태 탭">
    <button class="chip on" type="button" role="tab" aria-selected="true" data-filter="all">전체 <b id="cAll">0</b></button>
    <button class="chip" type="button" role="tab" aria-selected="false" data-filter="new">오늘 신규 <b id="cNew">0</b></button>
    <button class="chip" type="button" role="tab" aria-selected="false" data-filter="done">신청완료 <b id="cDone">0</b></button>
  </div>
  <div class="chips cats" role="tablist" aria-label="카테고리 필터">
    <button class="chip cat" type="button" role="tab" aria-selected="true" data-cat="all">전체 <b>0</b></button>
    <button class="chip cat" type="button" role="tab" aria-selected="false" data-cat="food">식품 <b>0</b></button>
    <button class="chip cat" type="button" role="tab" aria-selected="false" data-cat="living">리빙 <b>0</b></button>
    <button class="chip cat" type="button" role="tab" aria-selected="false" data-cat="digital">디지털 <b>0</b></button>
    <button class="chip cat" type="button" role="tab" aria-selected="false" data-cat="beauty">뷰티 <b>0</b></button>
    <button class="chip cat" type="button" role="tab" aria-selected="false" data-cat="fashion">패션 <b>0</b></button>
    <button class="chip cat" type="button" role="tab" aria-selected="false" data-cat="leisure">레저 <b>0</b></button>
    <button class="chip cat" type="button" role="tab" aria-selected="false" data-cat="pet">반려 <b>0</b></button>
    <button class="chip cat" type="button" role="tab" aria-selected="false" data-cat="etc">기타 <b>0</b></button>
  </div>
  <div class="sortrow">
    <span class="count" id="shownCount">–</span>
    <select id="sort" aria-label="정렬">
      <option value="rate">당첨확률 높은순</option>
      <option value="recruit">모집인원 많은순</option>
      <option value="deadline">마감임박순</option>
    </select>
  </div>
</div>

<main id="list" aria-live="polite"></main>
<div class="empty" id="empty" hidden></div>
<button id="more" type="button" hidden>더 보기</button>
<noscript><p class="empty">이 페이지는 자바스크립트가 필요합니다.</p></noscript>
<footer id="foot"></footer>
<div id="toast" role="status" aria-live="polite"></div>

<!-- 기록 옮기기 — 크롬(앱)에서 쓰던 신청완료·숨김을 다른 기기로 1회 옮기는 패널 -->
<div class="sheet" id="transfer" hidden role="dialog" aria-modal="true" aria-labelledby="transferTitle">
  <div class="sheet-back" data-transfer-close="1"></div>
  <div class="sheet-body">
    <div class="sheet-head">
      <h2 id="transferTitle">기록 옮기기</h2>
      <button class="sheet-x" id="transferClose" type="button" aria-label="닫기">✕</button>
    </div>
    <p class="sheet-desc">기록은 이 브라우저(앱)에만 저장돼요. 지금 쓰는 곳의 <b>신청완료·숨김</b>을
      다른 곳으로 한 번 옮길 때 씁니다.</p>
    <div class="tr-step">
      <div class="tr-label">① 내 기록 복사하기</div>
      <button class="tr-btn" id="transferCopy" type="button">내 기록 복사하기</button>
      <p class="tr-note" id="transferNote" role="status"></p>
    </div>
    <div class="tr-step">
      <div class="tr-label">② 기록 붙여넣어 불러오기</div>
      <textarea id="transferText" rows="3" spellcheck="false" autocomplete="off"
        placeholder="복사한 글자를 여기에 붙여넣기" aria-label="옮길 기록 글자"></textarea>
      <div class="tr-actions">
        <button class="tr-btn" id="transferMerge" type="button">불러오기 (합치기)</button>
        <button class="tr-btn ghost" id="transferReplace" type="button">덮어쓰기</button>
      </div>
      <p class="tr-note" id="transferMsg" role="status"></p>
      <p class="tr-warn">덮어쓰기를 누르면 이 기기의 기존 기록은 지워지고 붙여넣은 기록만 남아요.</p>
    </div>
  </div>
</div>

<script src="app.js" defer></script>
</body>
</html>

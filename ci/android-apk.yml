# ─────────────────────────────────────────────────────────────
# 이 파일은 GitHub App 권한(workflows)이 없어 자동으로 올릴 수 없을 때의 사본입니다.
# .github/workflows/android-apk.yml 과 내용이 같습니다.
# 활성화 방법 (둘 중 하나):
#  1) GitHub 웹에서 이 파일 내용을 복사해 `.github/workflows/android-apk.yml` 로 새 파일 추가
#  2) 저장소 Settings → Actions → General 에서 Workflow permissions 를 Read and write 로 두고,
#     로컬에서 `mkdir -p .github/workflows && cp ci/android-apk.yml .github/workflows/android-apk.yml` 후 push
# ─────────────────────────────────────────────────────────────
name: Android APK

on:
  push:
    branches: [main]
    paths:
      - 'android-app/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        working-directory: android-app
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: List APK
        working-directory: android-app
        run: ls -lh app/build/outputs/apk/debug/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: kakao-trial-feed-debug-apk
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 90
